// author.proto is the contract for author-service.
//
// One .proto file generates three things (see Makefile):
//   - authorpb/author.pb.go       Go structs for every message
//   - authorpb/author_grpc.pb.go  the gRPC server interface and client
//   - REST handlers (in user-service) from the google.api.http options below
//
// Naming follows the protobuf style guide: messages are PascalCase, fields are
// snake_case (JSON turns them into camelCase, e.g. author_id -> authorId), and
// each RPC has its own <Rpc>Request message so fields can be added later
// without breaking other RPCs.
syntax = "proto3";

package library.author;

// Generated Go code goes to protobuf/authorpb, package authorpb.
option go_package = "/authorpb";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// Author is what API clients see. It is not the database model; the handler
// converts between the two (see internal/handler).
message Author {
    uint64 id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    string name = 2;
    string biography = 3;
}

message CreateAuthorRequest {
    string name = 1 [(google.api.field_behavior) = REQUIRED];
    string biography = 2;
}

message GetAuthorRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// UpdateAuthorRequest changes only the fields that are set (non-empty).
message UpdateAuthorRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
    string name = 2;
    string biography = 3;
}

message DeleteAuthorRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteAuthorResponse {
    string message = 1;
}

service AuthorService {
    rpc CreateAuthor(CreateAuthorRequest) returns (Author) {
        option (google.api.http) = {
            post: "/api/author"
            body: "*"
        };
    };
    // ListAuthors is a server stream: authors are sent one by one instead of
    // in one big array. Through REST this becomes one JSON object per line.
    rpc ListAuthors(google.protobuf.Empty) returns (stream Author) {
        option (google.api.http) = {
            get: "/api/authors"
        };
    };
    // {id} in the path fills GetAuthorRequest.id.
    rpc GetAuthor(GetAuthorRequest) returns (Author) {
        option (google.api.http) = {
            get: "/api/author/{id}"
        };
    };
    rpc UpdateAuthor(UpdateAuthorRequest) returns (Author) {
        option (google.api.http) = {
            put: "/api/author/{id}"
            body: "*"
        };
    };
    rpc DeleteAuthor(DeleteAuthorRequest) returns (DeleteAuthorResponse) {
        option (google.api.http) = {
            delete: "/api/author/{id}"
        };
    };
}
