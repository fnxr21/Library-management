// book.proto is the contract for book-service. See author.proto for the
// general layout; this file adds stock handling and links to other services.
syntax = "proto3";

package library.book;

// Generated Go code goes to protobuf/bookpb, package bookpb.
option go_package = "/bookpb";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

message Book {
    uint64 id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    string name = 2;
    string description = 3;
    uint64 author_id = 4;
    // Copied from author-service when the book is saved, so reading a book
    // does not need a call to author-service.
    string author_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    int32 stock = 6;
    repeated BookCategory categories = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// BookCategory is a category linked to a book, with its name copied from
// category-service.
message BookCategory {
    uint64 id = 1;
    string name = 2;
}

message CreateBookRequest {
    string name = 1 [(google.api.field_behavior) = REQUIRED];
    string description = 2;
    uint64 author_id = 3 [(google.api.field_behavior) = REQUIRED];
    int32 stock = 4;
    repeated uint64 category_ids = 5;
}

message GetBookRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// UpdateBookRequest changes only the fields that are set. Stock is not here
// on purpose: it changes only through AdjustStock, which is race-safe.
message UpdateBookRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
    string name = 2;
    string description = 3;
    uint64 author_id = 4;
    // When non-empty, replaces the book's categories.
    repeated uint64 category_ids = 5;
}

message AdjustStockRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
    // Positive adds copies, negative removes them. Stock never goes below zero.
    int32 delta = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteBookRequest {
    uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteBookResponse {
    string message = 1;
}

service BookService {
    rpc CreateBook(CreateBookRequest) returns (Book) {
        option (google.api.http) = {
            post: "/api/book"
            body: "*"
        };
    };
    rpc ListBooks(google.protobuf.Empty) returns (stream Book) {
        option (google.api.http) = {
            get: "/api/books"
        };
    };
    rpc GetBook(GetBookRequest) returns (Book) {
        option (google.api.http) = {
            get: "/api/book/{id}"
        };
    };
    rpc UpdateBook(UpdateBookRequest) returns (Book) {
        option (google.api.http) = {
            put: "/api/book/{id}"
            body: "*"
        };
    };
    rpc AdjustStock(AdjustStockRequest) returns (Book) {
        option (google.api.http) = {
            post: "/api/book/{id}/stock"
            body: "*"
        };
    };
    rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse) {
        option (google.api.http) = {
            delete: "/api/book/{id}"
        };
    };
}
